<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorry na ate Rizza 🥺</title>
<style>
:root{--bg1:#ffe9f0;--bg2:#ffd3e3;--card:#fff;--text:#4a1f33;--muted:#8a5a70;--accent:#ff4d85;--accent2:#ff8fb3;--shadow:rgba(255,77,133,.3);--pop:#fff6c9;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1020;--bg2:#3d1630;--card:#3a1a2c;--text:#ffe9f1;--muted:#e0aac0;--accent:#ff6b9a;--accent2:#c93a6c;--shadow:rgba(0,0,0,.5);--pop:#4a3a12;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a1020;--bg2:#3d1630;--card:#3a1a2c;--text:#ffe9f1;--muted:#e0aac0;--accent:#ff6b9a;--accent2:#c93a6c;--shadow:rgba(0,0,0,.5);--pop:#4a3a12;color-scheme:dark}
html{min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2));overflow:hidden}
.card{width:100%;max-width:420px;background:var(--card);border-radius:28px;padding:34px 24px;text-align:center;box-shadow:0 20px 50px var(--shadow);position:relative;z-index:2;animation:pop .5s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.big{font-size:70px;line-height:1;animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
h1{margin:12px 0 6px;font-size:32px}
p{color:var(--muted);margin:6px 0 22px;line-height:1.5}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:14px 30px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px var(--shadow);transition:transform .15s}
button:active{transform:scale(.94)}
.row{display:flex;gap:14px;justify-content:center;align-items:center;min-height:56px}
#no{background:#8f7f88;box-shadow:none}
.bubble{position:fixed;z-index:5;max-width:200px;padding:12px 16px;border-radius:18px;background:var(--pop);color:var(--text);font-weight:600;font-size:15px;box-shadow:0 8px 22px var(--shadow);animation:bub .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes bub{from{transform:scale(0) rotate(-12deg)}to{transform:scale(1) rotate(0)}}
#cat{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;background:var(--bg1)}
#cat.on{display:flex;animation:pop .35s ease}
.cat{font-size:min(38vw,170px);line-height:1;position:relative}
.cat .f{position:absolute;right:-8%;bottom:-6%;font-size:.5em;animation:wag .5s infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
#cat h2{font-size:28px;margin:30px 0 6px}
#theme{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:6;padding:8px 12px;font-size:18px;background:var(--card);box-shadow:0 4px 12px var(--shadow)}
</style>
</head>
<body>
<button id="theme" aria-label="Toggle theme">🌙</button>

<main class="card">
  <div class="big">🥺</div>
  <h1>Sorry na, ate Rizza!</h1>
  <p>Sorry na</p>
  <div class="row" id="row">
    <button id="ok">Ok 💖</button>
    <button id="no">Ayoko 😤</button>
  </div>
</main>

<div id="cat">
  <div class="cat">😼<span class="f">🖕</span></div>
  <h2>Eto sayo, ate! 😹</h2>
  <p>Jokee ahhahaha 😂</p>
</div>

<script>
var $ = function(id){return document.getElementById(id);};
var lines = [
  "Sige na ate 🥺","Libre kita milk tea! 🧋","Ayoko daw? Pindutin mo yung Ok 😭",
  "Last na, promise 🙏","Ate naman eh 💔","Nasaktan ako 😢","Sorry na po 🌹",
  "Sige na, please 🥹","Bati na tayo! 💞","Pasalubong kita! 🍫"
];
var count = 0, no = $("no");

function rnd(min, max){ return min + Math.random()*(max-min); }

function popup(){
  var b = document.createElement("div");
  b.className = "bubble";
  b.textContent = lines[Math.floor(Math.random()*lines.length)];
  document.body.appendChild(b);
  b.style.left = rnd(8, Math.max(9, innerWidth-220)) + "px";
  b.style.top = rnd(8, Math.max(9, innerHeight-80)) + "px";
  setTimeout(function(){
    b.style.transition = "opacity .4s"; b.style.opacity = 0;
    setTimeout(function(){ b.remove(); }, 400);
  }, 3500);
}

no.onclick = function(){
  no.style.position = "fixed";
  no.style.zIndex = 6;
  no.style.left = rnd(8, Math.max(9, innerWidth-no.offsetWidth-8)) + "px";
  no.style.top = rnd(8, Math.max(9, innerHeight-no.offsetHeight-8)) + "px";
};

$("ok").onclick = function(){ $("cat").classList.add("on"); };

var th = $("theme"), dark = matchMedia("(prefers-color-scheme: dark)").matches;
function applyTheme(){ document.documentElement.setAttribute("data-theme", dark ? "dark" : "light"); th.textContent = dark ? "☀️" : "🌙"; }
applyTheme();
th.onclick = function(){ dark = !dark; applyTheme(); };
</script>
</body>
</html>
